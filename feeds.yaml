# Source registry for the payments news harvester.
# Edit here to add/remove sources; the harvester reports per-source health each run,
# so a dead feed is visible, not silent.
#
# type: feed       — RSS 2.0 / Atom / RSS 1.0. Holds only what the publisher exposes
#                    (often 10–50 items), so it is polled every 6 hours to build history.
# type: wp_rest    — WordPress REST API. Supports full history (--since).
# type: html_list  — a listing page with no feed. Links matched by link_pattern; dated from
#                    the page if a date is found, otherwise by first sighting (date_estimated).
# type: feed + kind: proxy — a Google News RSS query for sites that block feed readers.
#                    Links are Google redirect links; the title/date/source are reliable and
#                    the editor locates the primary page. Discovery only.
# tier: 1 = scanning source (discovery); 2 = primary source (regulators, central banks,
#       schemes, standards bodies)
# verified: date the URL was last seen working in health.json; false = not yet confirmed

polite_delay_seconds: 1

sources:
  # ---------------------------------------------------------------- Tier 1: scanning sources
  - name: pymnts
    type: wp_rest
    url: https://www.pymnts.com
    tier: 1
    kind: aggregator
    verified: 2026-10-14

  - name: finextra-payments
    type: feed
    url: https://www.finextra.com/rss/channel.aspx?channel=payments
    tier: 1
    kind: aggregator
    verified: 2026-10-14

  - name: finextra-headlines
    type: feed
    url: https://www.finextra.com/rss/headlines.aspx
    tier: 1
    kind: aggregator
    verified: 2026-10-14

  - name: thepaypers
    type: html_list            # The Paypers publishes no feed; its category listing pages carry dates
    url: https://thepaypers.com/news
    pages:
      - https://thepaypers.com/news
      - https://thepaypers.com/payments/news
      - https://thepaypers.com/fraud-and-fincrime/news
      - https://thepaypers.com/crypto-web3-and-cbdc/news
      - https://thepaypers.com/digital-identity-security-online-fraud/news
      - https://thepaypers.com/fintech/news
    link_pattern: 'https?://thepaypers\.com/[a-z0-9-]+/news/[a-z0-9-]+'
    tier: 1
    kind: aggregator
    verified: false

  - name: ft-companies-financials
    type: feed
    url: https://www.ft.com/companies/financials?format=rss
    tier: 1
    kind: aggregator
    verified: 2026-10-14

  # ---------------------------------------------------------------- Tier 2: Australian regulators
  - name: rba-media-releases
    type: feed
    url: https://www.rba.gov.au/rss/rss-cb-media-releases.xml
    tier: 2
    kind: central-bank
    verified: 2026-10-14

  - name: rba-speeches
    type: feed
    url: https://www.rba.gov.au/rss/rss-cb-speeches.xml
    tier: 2
    kind: central-bank
    verified: 2026-10-14

  - name: treasury-au-consultations
    type: html_list            # no feed; the consultation index page lists title + date range
    url: https://treasury.gov.au/consultation
    link_pattern: 'https?://treasury\.gov\.au/consultation/[a-z0-9-]+'
    tier: 2
    kind: regulator
    verified: false

  - name: apra-news
    type: feed
    url: https://www.apra.gov.au/rss.xml
    tier: 2
    kind: regulator
    verified: 2026-10-14

  - name: asic-news-proxy
    type: feed
    kind: proxy
    url: https://news.google.com/rss/search?q=site:asic.gov.au+when:14d&hl=en-AU&gl=AU&ceid=AU:en
    tier: 2
    verified: false            # asic.gov.au has no feed and its newsroom renders in-browser only

  - name: austrac-proxy
    type: feed
    kind: proxy
    url: https://news.google.com/rss/search?q=site:austrac.gov.au+when:14d&hl=en-AU&gl=AU&ceid=AU:en
    tier: 2
    verified: false            # austrac.gov.au times out for feed readers

  - name: accc-proxy
    type: feed
    kind: proxy
    url: https://news.google.com/rss/search?q=site:accc.gov.au+when:14d&hl=en-AU&gl=AU&ceid=AU:en
    tier: 2
    verified: false            # accc.gov.au returns 403 to feed readers

  # ---------------------------------------------------------------- Tier 2: peer central banks & regulators
  - name: fed-press
    type: feed
    url: https://www.federalreserve.gov/feeds/press_all.xml
    tier: 2
    kind: central-bank
    verified: 2026-10-14

  - name: ecb-press
    type: feed
    url: https://www.ecb.europa.eu/rss/press.html
    tier: 2
    kind: central-bank
    verified: 2026-10-14

  - name: boe-news
    type: feed
    url: https://www.bankofengland.co.uk/rss/news
    tier: 2
    kind: central-bank
    verified: 2026-10-14

  - name: fca-news
    type: feed
    url: https://www.fca.org.uk/news/rss.xml
    tier: 2
    kind: regulator
    verified: 2026-10-14       # dates now parsed (format "Tuesday, October 13, 2026 - 11:30")

  - name: psr-proxy
    type: feed
    kind: proxy
    url: https://news.google.com/rss/search?q=site:psr.org.uk+when:14d&hl=en-GB&gl=GB&ceid=GB:en
