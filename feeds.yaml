    tier: 2
    kind: regulator
    verified: 2026-10-14

  # ---------------------------------------------------------------- Tier 2: schemes, PSPs, standards
  # These newsrooms block feed readers or publish no feed. Google News queries give
  # discovery (title, date, source); the editor fetches the primary page.
  - name: schemes-proxy
    type: feed
    kind: proxy
    url: https://news.google.com/rss/search?q=(site:mastercard.com+OR+site:visa.com+OR+site:americanexpress.com)+when:14d&hl=en-US&gl=US&ceid=US:en
    tier: 2
    verified: false

  - name: psps-proxy
    type: feed
    kind: proxy
    url: https://news.google.com/rss/search?q=(site:stripe.com+OR+site:newsroom.paypal-corp.com+OR+site:adyen.com+OR+site:swift.com)+when:14d&hl=en-US&gl=US&ceid=US:en
    tier: 2
    verified: false

  - name: emvco-news
    type: feed
    url: https://www.emvco.com/feed/
    tier: 2
    kind: standards
    verified: false            # feed exists but returned 0 items on 14 Oct 2026 — watch

  # ---------------------------------------------------------------- Disabled (kept for the record)
  - name: treasury-au-media
    type: feed
    url: https://treasury.gov.au/media-release/rss.xml
