# Source registry for the payments news harvester.
# Edit here to add/remove sources; the harvester reports per-source health each run,
# so a dead feed is visible, not silent.
#
# type: feed     — RSS 2.0 / Atom / RSS 1.0. Holds only what the publisher exposes
#                  (often 10–50 items), so it must be polled daily to build history.
# type: wp_rest  — WordPress REST API. Supports full history (--since), so a once-per-cycle
#                  pull is complete even if the daily poller missed days.
# tier: 1 = scanning source (discovery); 2 = primary source (regulators, central banks, schemes, standards bodies)
# kind: aggregator | regulator | central-bank | scheme | standards
# verified: true  — confirmed working on 12 Oct 2026. false — URL believed correct; check health.json after the first run.

polite_delay_seconds: 1

sources:
  # ---------------------------------------------------------------- Tier 1: scanning sources
  - name: pymnts
    type: wp_rest
    url: https://www.pymnts.com
    tier: 1
    kind: aggregator
    verified: true          # REST API confirmed; ~30–50 posts/day; full-window pull supported

  - name: finextra-payments
    type: feed
    url: https://www.finextra.com/rss/channel.aspx?channel=payments
    tier: 1
    kind: aggregator
    verified: true          # ~50 items in feed; mixes news, videos, events, blogs — triage ignores non-news

  - name: finextra-headlines
    type: feed
    url: https://www.finextra.com/rss/headlines.aspx
    tier: 1
    kind: aggregator
    verified: true

  - name: thepaypers
    type: feed
    url: https://thepaypers.com/rss/news
    tier: 1
    kind: aggregator
    verified: false         # The Paypers feed URL could not be confirmed on 12 Oct 2026 (JS page). If health shows error,
                            # try https://thepaypers.com/rss or ask Claude to locate the current feed URL; the editor's
                            # coverage check searches thepaypers.com directly regardless.

  - name: ft-companies-financials
    type: feed
    url: https://www.ft.com/companies/financials?format=rss
    tier: 1
    kind: aggregator
    verified: false         # FT section feeds give headlines + standfirst only (paywall); still useful for discovery

  # ---------------------------------------------------------------- Tier 2: Australian regulators
