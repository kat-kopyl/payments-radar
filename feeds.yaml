    url: https://news.google.com/rss/search?q=site:mas.gov.sg+when:14d&hl=en-SG&gl=SG&ceid=SG:en
    tier: 2
    verified: false            # mas.gov.sg feed returned no items

  - name: hkma-press
    type: feed
    url: https://www.hkma.gov.hk/eng/other-information/rss/rss_press-release.xml
    tier: 2
    kind: regulator
    verified: false            # corrected URL from the HKMA RSS directory

  - name: cfpb-newsroom
